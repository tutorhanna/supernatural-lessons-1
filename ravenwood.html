<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravenwood — The First Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Georgia', serif; background: #000; color: #fff; overflow: hidden; height: 100vh; }
  #game { position: relative; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
  #bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: opacity 0.8s ease; z-index: 1; }
  #stats { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.75); padding: 15px 20px; border-radius: 8px; border-left: 4px solid #b8860b; font-family: 'Courier New', monospace; font-size: 14px; min-width: 200px; }
  #stats .stat { margin: 4px 0; display: flex; justify-content: space-between; }
  #stats .fear { color: #ff6b6b; } #stats .logic { color: #6bb8ff; } #stats .rage { color: #ffaa44; }
  #stats .inv { margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; color: #b8860b; font-size: 12px; line-height: 1.5; }
  #text-box { position: absolute; bottom: 0; left: 0; width: 100%; min-height: 25%; background: rgba(0,0,0,0.88); padding: 30px 60px 70px 60px; z-index: 5; font-size: 20px; line-height: 1.6; cursor: pointer; border-top: 2px solid #2d4a2a; }
  #text-box .who { color: #b8860b; font-weight: bold; font-size: 22px; margin-bottom: 8px; display: block; }
  #controls { position: absolute; bottom: 15px; right: 30px; z-index: 15; display: flex; gap: 10px; }
  #controls button { background: #2d4a2a; color: #fff; border: 2px solid #1a3a1a; padding: 10px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  #controls button:hover { background: #b8860b; color: #000; border-color: #b8860b; }
  #controls button:disabled { opacity: 0.3; cursor: not-allowed; }
  #hint { position: absolute; bottom: 20px; left: 30px; color: #888; font-size: 14px; z-index: 15; font-style: italic; }
  #choices { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; display: none; flex-direction: column; gap: 15px; width: 80%; max-width: 800px; }
  #choices .choice { background: #2d4a2a; border: 2px solid #1a3a1a; padding: 20px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1.5; transition: all 0.3s; color: #fff; }
  #choices .choice:hover { background: #1a3a1a; border-color: #b8860b; transform: scale(1.02); }
  #grammar-overlay, #exercise-overlay, #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 100; display: none; align-items: center; justify-content: center; }
  #grammar-box { background: #1a3a1a; border: 3px solid #b8860b; border-radius: 10px; padding: 40px 50px; max-width: 700px; text-align: center; }
  #grammar-box .label { color: #b8860b; font-size: 24px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
  #grammar-box .text { color: #fff; font-size: 20px; line-height: 1.6; margin-bottom: 25px; }
  #grammar-box .btn { background: #b8860b; color: #000; border: none; padding: 12px 40px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  #exercise-box { background: #1a1a2a; border: 3px solid #6bb8ff; border-radius: 10px; padding: 40px 50px; max-width: 850px; max-height: 90vh; overflow-y: auto; }
  #exercise-box .label { color: #6bb8ff; font-size: 22px; font-weight: bold; margin-bottom: 15px; letter-spacing: 2px; }
  #exercise-box .question { color: #fff; font-size: 20px; line-height: 1.7; margin-bottom: 25px; }
  #exercise-box .question .blank { color: #b8860b; font-weight: bold; font-size: 22px; }
  #exercise-box .options { display: flex; flex-direction: column; gap: 12px; }
  #exercise-box .option { background: #2a2a3a; border: 2px solid #444; padding: 15px 25px; border-radius: 6px; cursor: pointer; font-size: 18px; color: #fff; text-align: left; }
  #exercise-box .option:hover { background: #3a3a4a; border-color: #6bb8ff; }
  #exercise-box .option.correct { background: #1a4a2a; border-color: #4aff88; color: #4aff88; }
  #exercise-box .option.wrong { background: #4a1a1a; border-color: #ff4a4a; color: #ff4a4a; }
  #exercise-box .feedback { margin-top: 20px; padding: 20px; border-radius: 6px; font-size: 16px; line-height: 1.7; display: none; }
  #exercise-box .feedback.correct { background: rgba(74,255,136,0.1); border-left: 4px solid #4aff88; color: #d0ffe0; }
  #exercise-box .feedback.wrong { background: rgba(255,74,74,0.1); border-left: 4px solid #ff4a4a; color: #ffd0d0; }
  #exercise-box .feedback .head { font-size: 19px; font-weight: bold; display: block; margin-bottom: 10px; }
  #exercise-box .feedback.correct .head { color: #4aff88; }
  #exercise-box .feedback.wrong .head { color: #ff4a4a; }
  #exercise-box .feedback .answer-line { color: #b8860b; font-weight: bold; font-size: 18px; display: block; margin: 12px 0; padding: 10px; background: rgba(184,134,11,0.15); border-radius: 4px; }
  #exercise-box .feedback strong { color: #ffaa44; }
  #exercise-box .feedback em { color: #6bb8ff; font-style: normal; }
  #exercise-box .continue-btn { margin-top: 20px; background: #6bb8ff; color: #000; border: none; padding: 12px 40px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; }
  #exercise-box .continue-btn:hover { background: #8bc8ff; }
  #start-overlay { display: flex; }
  #start-box { background: #1a1a2a; border: 3px solid #b8860b; border-radius: 10px; padding: 50px 70px; text-align: center; max-width: 600px; }
  #start-box h1 { color: #b8860b; font-size: 36px; margin-bottom: 20px; letter-spacing: 3px; }
  #start-box p { color: #ccc; font-size: 18px; margin-bottom: 30px; line-height: 1.6; }
  #start-box button { display: block; width: 100%; margin: 10px 0; padding: 15px; font-size: 18px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; letter-spacing: 1px; transition: all 0.2s; }
  #start-box .btn-continue { background: #2d4a2a; color: #fff; border: 2px solid #1a3a1a; }
  #start-box .btn-continue:hover { background: #b8860b; color: #000; border-color: #b8860b; }
  #start-box .btn-new { background: transparent; color: #b8860b; border: 2px solid #b8860b; }
  #start-box .btn-new:hover { background: #b8860b; color: #000; }
  .stat-change { position: absolute; top: 120px; left: 20px; z-index: 15; font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; opacity: 0; transition: all 1s ease; pointer-events: none; }
  .stat-change.show { opacity: 1; transform: translateY(-25px); }
  .stat-change.fear { color: #ff6b6b; } .stat-change.logic { color: #6bb8ff; } .stat-change.rage { color: #ffaa44; }
</style>
</head>
<body>

<div id="game">
  <div id="bg"></div>
  
  <div id="stats">
    <div class="stat fear"><span>😨 Fear:</span> <span id="fear-val">0</span></div>
    <div class="stat logic"><span>🧠 Logic:</span> <span id="logic-val">0</span></div>
    <div class="stat rage"><span>😡 Rage:</span> <span id="rage-val">0</span></div>
    <div class="inv" id="inventory">📦 Inventory: empty</div>
  </div>
  
  <div id="text-box" onclick="nextText()">
    <span class="who" id="who"></span>
    <span id="text"></span>
  </div>
  
  <div id="hint">💡 Space / → / Click to continue · ← to go back</div>
  
  <div id="controls">
    <button id="btn-back" onclick="goBack()">← Back</button>
    <button id="btn-next" onclick="nextText()">Next →</button>
  </div>
  
  <div id="choices"></div>
  
  <div id="grammar-overlay">
    <div id="grammar-box">
      <div class="label">💡 GRAMMAR HINT</div>
      <div class="text" id="grammar-text"></div>
      <button class="btn" onclick="closeGrammar()">Continue</button>
    </div>
  </div>
  
  <div id="exercise-overlay">
    <div id="exercise-box">
      <div class="label">📝 GRAMMAR CHECK</div>
      <div class="question" id="ex-question"></div>
      <div class="options" id="ex-options"></div>
      <div class="feedback" id="ex-feedback"></div>
      <button class="continue-btn" id="ex-continue" onclick="closeExercise()">Continue →</button>
    </div>
  </div>
  
  <div id="start-overlay">
    <div id="start-box">
      <h1>🩸 RAVENWOOD</h1>
      <p>The First Night</p>
      <button class="btn-continue" id="btn-continue" onclick="continueGame()" style="display:none;">▶ Continue</button>
      <button class="btn-new" onclick="startNew()">🩸 New Game</button>
    </div>
  </div>
</div>

<script>
const IMG_PATH = 'game/images/';
const SAVE_KEY = 'ravenwood_save_v2';

let state = {
  fear: 0, logic: 0, rage: 0,
  inventory: { photoOfSymbol: false, cameraFootage: false, fathersJournal: false, silverKnife: false, salt: false, gun: false, oldPhoto: false },
  currentTexts: [],
  currentTextIndex: 0,
  currentSceneAfterTexts: null,
  history: [],
  currentSceneName: 'start'
};

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      fear: state.fear, logic: state.logic, rage: state.rage,
      inventory: state.inventory,
      sceneName: state.currentSceneName,
      textIndex: state.currentTextIndex
    }));
  } catch(e) {}
}
function loadSave() {
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
function hasSave() { return loadSave() !== null; }

function updateStats() {
  document.getElementById('fear-val').textContent = state.fear;
  document.getElementById('logic-val').textContent = state.logic;
  document.getElementById('rage-val').textContent = state.rage;
  const inv = [];
  if (state.inventory.photoOfSymbol) inv.push('📷 Symbol');
  if (state.inventory.cameraFootage) inv.push('📼 Footage');
  if (state.inventory.fathersJournal) inv.push('📓 Journal');
  if (state.inventory.silverKnife) inv.push('🗡 Knife');
  if (state.inventory.salt) inv.push('🧂 Salt');
  if (state.inventory.gun) inv.push('🔫 Gun');
  if (state.inventory.oldPhoto) inv.push('🖼 Photo');
  document.getElementById('inventory').textContent = '📦 ' + (inv.length ? inv.join(' · ') : 'empty');
}
function showStatChange(type, amount) {
  const el = document.createElement('div');
  el.className = 'stat-change ' + type + ' show';
  el.textContent = (amount > 0 ? '+' : '') + amount + ' ' + type.toUpperCase();
  document.getElementById('game').appendChild(el);
  setTimeout(() => el.classList.remove('show'), 100);
  setTimeout(() => el.remove(), 1500);
}
function changeStat(type, amount) {
  state[type] += amount;
  updateStats();
  showStatChange(type, amount);
}
function setBg(imageName) {
  document.getElementById('bg').style.backgroundImage = 'url("' + IMG_PATH + imageName + '")';
}

function ensureTextBox() {
  const tb = document.getElementById('text-box');
  // Если предыдущий экран перезаписал innerHTML (конец эпизода) и удалил структуру,
  // восстанавливаем стандартные элементы #who и #text
  if (!document.getElementById('who') || !document.getElementById('text')) {
    tb.innerHTML = '<span class="who" id="who"></span><span id="text"></span>';
  }
}
function showText(texts, nextScene) {
  state.currentTexts = texts;
  state.currentTextIndex = 0;
  state.currentSceneAfterTexts = nextScene;
  ensureTextBox();
  document.getElementById('choices').style.display = 'none';
  document.getElementById('text-box').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  renderCurrentText();
  saveGame();
}
function renderCurrentText() {
  const item = state.currentTexts[state.currentTextIndex];
  if (item === undefined) return;
  ensureTextBox();
  if (typeof item === 'string') {
    document.getElementById('who').textContent = '';
    document.getElementById('text').textContent = item;
  } else {
    document.getElementById('who').textContent = item.who || '';
    document.getElementById('text').textContent = item.text;
  }
  document.getElementById('btn-back').disabled = (state.currentTextIndex === 0);
}
function nextText() {
  if (document.getElementById('choices').style.display === 'flex') return;
  if (document.getElementById('text-box').style.display === 'none') return;
  if (state.currentTextIndex >= state.currentTexts.length - 1) {
    document.getElementById('text-box').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    if (state.currentSceneAfterTexts) {
      const fn = state.currentSceneAfterTexts;
      state.currentSceneAfterTexts = null;
      fn();
    }
  } else {
    state.currentTextIndex++;
    renderCurrentText();
    saveGame();
  }
}
function goBack() {
  if (state.currentTextIndex > 0) {
    state.currentTextIndex--;
    renderCurrentText();
    saveGame();
  }
}

function showChoices(question, options) {
  state.history.push(state.currentSceneName);
  const box = document.getElementById('choices');
  box.innerHTML = '';
  box.style.display = 'flex';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
  const q = document.createElement('div');
  q.style.cssText = 'text-align:center;color:#b8860b;font-size:22px;margin-bottom:10px;background:rgba(0,0,0,0.85);padding:15px;border-radius:8px;';
  q.textContent = question;
  box.appendChild(q);
  options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'choice';
    btn.textContent = opt.text;
    btn.onclick = () => { box.style.display = 'none'; opt.action(); };
    box.appendChild(btn);
  });
}

let grammarCallback = null;
function showGrammar(text, callback) {
  document.getElementById('grammar-text').textContent = text;
  document.getElementById('grammar-overlay').style.display = 'flex';
  grammarCallback = callback;
}
function closeGrammar() {
  document.getElementById('grammar-overlay').style.display = 'none';
  if (grammarCallback) { const cb = grammarCallback; grammarCallback = null; cb(); }
}

let exerciseCallback = null;
function showExercise(question, options, correctIndex, explanation, callback) {
  document.getElementById('ex-question').innerHTML = question;
  const optsBox = document.getElementById('ex-options');
  const fb = document.getElementById('ex-feedback');
  const cont = document.getElementById('ex-continue');
  optsBox.innerHTML = '';
  fb.style.display = 'none';
  fb.className = 'feedback';
  cont.style.display = 'none';
  let answered = false;
  options.forEach((opt, idx) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      const allOpts = optsBox.querySelectorAll('.option');
      if (idx === correctIndex) {
        btn.classList.add('correct');
        fb.className = 'feedback correct';
        fb.innerHTML = '<span class="head">✅ Correct!</span>' + explanation;
      } else {
        btn.classList.add('wrong');
        allOpts[correctIndex].classList.add('correct');
        fb.className = 'feedback wrong';
        fb.innerHTML = '<span class="head">❌ Not quite.</span><span class="answer-line">Correct answer: ' + options[correctIndex] + '</span>' + explanation;
      }
      fb.style.display = 'block';
      cont.style.display = 'inline-block';
    };
    optsBox.appendChild(btn);
  });
  document.getElementById('exercise-overlay').style.display = 'flex';
  exerciseCallback = callback;
}
function closeExercise() {
  document.getElementById('exercise-overlay').style.display = 'none';
  if (exerciseCallback) { const cb = exerciseCallback; exerciseCallback = null; cb(); }
}

function scene(name, fn) {
  scenes[name] = function() {
    state.currentSceneName = name;
    saveGame();
    fn();
  };
}

const scenes = {};

// ============================================================
//  SCENE START
// ============================================================
scene('start', function() {
  setBg('car_interior.jpg');
  showText([
    "The highway stretches ahead, endless and dark. Three hours from the city back to Ravenwood.",
    "You've been driving for two hours. Your hands are tight on the wheel. Your mind keeps replaying the same four words: four days of silence.",
    "Four days. No calls. No texts. No 'we're fine, just busy.' Just... nothing.",
    "And then, as if the radio knew — the song starts playing. 'Carry On Wayward Son.' Dad's song. The one he always played on long drives when you were a kid, half-asleep in the back seat.",
    "You haven't heard it in years. And now, tonight, on this empty road — it feels like a sign."
  ], () => {
    showChoices("What do you do with the radio?", [
      { text: "You let it play. It's Dad's song. It feels like he's here.", action: () => { changeStat('fear', 1); changeStat('logic', 1); scenes.scene1_play(); } },
      { text: "You turn it off. It hurts too much.", action: () => { changeStat('rage', 1); scenes.scene1_off(); } },
      { text: "You sing along. Your eyes fill with tears.", action: () => { changeStat('fear', 1); scenes.scene1_sing(); } }
    ]);
  });
});

scene('scene1_play', function() {
  setBg('Song_in_car.jpg');
  showText([
    "You let the song play. The guitar fills the car. For a moment, you feel like your father is sitting next to you.",
    {who: "You", text: "I'm coming, Dad. I'm coming."},
    "Your hands stop shaking."
  ], () => {
    showGrammar("Past Simple: 'You let it play. Your hands stopped shaking.' — завершённые действия в прошлом.", () => {
      showExercise(
        "Complete the sentence (Past Simple vs Past Continuous):<br><br>The song <span class='blank'>___</span> when your hands <span class='blank'>___</span> to shake.",
        ["was playing · stopped", "played · were stopping", "was playing · were stopping"],
        0,
        "<strong>was playing</strong> — Past Continuous: <em>фоновое действие</em> (песня играла в тот момент).<br><br><strong>stopped</strong> — Past Simple: <em>короткое завершённое действие</em> (руки перестали трястись — это случилось).<br><br><strong>Почему не другие:</strong><br>• «played» — неверно, потому что песня <em>играла в процессе</em>, а не просто «играла когда-то».<br>• «were stopping» — неверно, потому что «перестать трястись» — это <em>мгновенное действие</em>, а Past Continuous — для длительных.<br>• «was playing · were stopping» — та же ошибка.",
        () => scenes.scene2()
      );
    });
  });
});

scene('scene1_off', function() {
  setBg('Song_in_car.jpg');
  showText([
    "You turn it off. The silence is worse. The road feels darker. But the anger keeps you awake.",
    {who: "You", text: "Why didn't you tell me anything?"},
    "You press the gas pedal harder."
  ], () => {
    showGrammar("Past Simple: 'You turned it off. The silence was worse.' — короткие завершённые действия.", () => {
      showExercise(
        "Complete the sentence (Past Simple):<br><br>You <span class='blank'>___</span> the radio off. The silence <span class='blank'>___</span> worse than the song.",
        ["turned · was", "was turning · were", "turned · were"],
        0,
        "<strong>turned</strong> — Past Simple: <em>завершённое действие</em> (ты выключил — факт).<br><br><strong>was</strong> — Past Simple глагола <em>be</em>: <em>состояние в прошлом</em> (тишина <em>была</em> хуже).<br><br><strong>Почему не другие:</strong><br>• «was turning» — неверно, ты не «выключал в процессе», ты просто <em>выключил</em>.<br>• «were» — неверно, потому что «silence» — неисчисляемое существительное в единственном числе, поэтому <em>was</em>, а не <em>were</em>.",
        () => scenes.scene2()
      );
    });
  });
});

scene('scene1_sing', function() {
  setBg('Song_in_car.jpg');
  showText([
    "You sing along, your voice cracking. Tears run down your face, but you don't wipe them away.",
    {who: "You", text: "Carry on, my wayward son..."},
    "It feels like a goodbye. And a promise."
  ], () => {
    showGrammar("Past Continuous: 'Tears were running down your face.' — фоновое действие в момент речи.", () => {
      showExercise(
        "Complete the sentence (Past Continuous):<br><br>While you <span class='blank'>___</span> along, tears <span class='blank'>___</span> down your face.",
        ["were singing · were running", "sang · ran", "was singing · was running"],
        0,
        "<strong>were singing · were running</strong> — оба глагола в Past Continuous: <em>два длительных действия происходили одновременно</em>.<br><br><strong>Почему не другие:</strong><br>• «sang · ran» — неверно, потому что действия <em>длились</em>, а не были короткими.<br>• «was singing · was running» — неверно, потому что подлежащее <em>you</em> (ты) требует <em>were</em>, а не <em>was</em>. «Tears» — множественное число, тоже <em>were</em>.",
        () => scenes.scene2()
      );
    });
  });
});

// ============================================================
//  SCENE 2
// ============================================================
scene('scene2', function() {
  setBg('Welcome_to_Ravenwood.jpg');
  showText([
    "The 'Welcome to Ravenwood' sign appears in your headlights. Population: 2,100.",
    "The same sign you've seen a hundred times. The same rusty metal. The same peeling paint.",
    "But tonight, it doesn't feel like home. It feels like a warning.",
    "You drive past it. Slowly.",
    "The road into town is empty. No cars. No people. Just the dark fields on both sides and the enormous sky above."
  ], () => {
    showExercise(
      "Complete the sentence (Present Simple vs Present Continuous):<br><br>Right now, you <span class='blank'>___</span> past the sign. Every time you <span class='blank'>___</span> home, the sign looks the same.",
      ["are driving · drive", "drive · are driving", "are driving · are driving"],
      0,
      "<strong>are driving</strong> — Present Continuous: <em>действие происходит прямо сейчас</em> (в этот момент).<br><br><strong>drive</strong> — Present Simple: <em>регулярное, повторяющееся действие</em> (каждый раз, когда ты едешь домой).<br><br><strong>Почему не другие:</strong><br>• «drive · are driving» — перепутаны местами: «прямо сейчас» → Continuous, «каждый раз» → Simple.<br>• «are driving · are driving» — неверно, потому что «every time» указывает на <em>регулярность</em>, а это Present Simple.",
      () => scenes.scene2b()
    );
  });
});

// ============================================================
//  SCENE 2b
// ============================================================
scene('scene2b', function() {
  setBg('kansas_road.jpg');
  showText([
    "Main Street is empty. The diner is closed. The gas station is dark. Even the church looks abandoned.",
    "You slow down. Your heart is pounding. You know every street here. Every shortcut. Every hiding place.",
    "You know which neighbours have dogs. Which ones sleep late. Which ones keep their porch light on all night.",
    "And you know one thing for sure: your parents' porch light is never off. Never."
  ], () => {
    showChoices("Where do you go first?", [

function startNew() {
  localStorage.removeItem(SAVE_KEY);
  state = {
    fear: 0, logic: 0, rage: 0,
    inventory: { photoOfSymbol: false, cameraFootage: false, fathersJournal: false, silverKnife: false, salt: false, gun: false, oldPhoto: false },
    currentTexts: [], currentTextIndex: 0, currentSceneAfterTexts: null, history: [], currentSceneName: 'start'
  };
  updateStats();
  document.getElementById('start-overlay').style.display = 'none';
  scenes.start();
}

function continueGame() {
  const save = loadSave();
  if (!save) { startNew(); return; }
  state.fear = save.fear || 0;
  state.logic = save.logic || 0;
  state.rage = save.rage || 0;
  state.inventory = save.inventory || state.inventory;
  updateStats();
  document.getElementById('start-overlay').style.display = 'none';
  const sceneName = save.sceneName || 'start';
  const fn = scenes[sceneName];
  if (fn) fn(); else scenes.start();
}

document.addEventListener('keydown', (e) => {
  if (document.getElementById('grammar-overlay').style.display === 'flex') return;
  if (document.getElementById('exercise-overlay').style.display === 'flex') return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
    e.preventDefault();
    if (document.getElementById('choices').style.display !== 'flex') nextText();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    goBack();
  }
});

updateStats();
if (hasSave()) {
  document.getElementById('btn-continue').style.display = 'block';
} else {
  document.getElementById('btn-continue').style.display = 'none';
}
